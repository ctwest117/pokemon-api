<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <div class="min-h-screen">
        <header class="flex h-16 w-full items-center justify-left bg-red-600 px-6 text-white shadow-sm gap-3">
            <img
                class="h-10 w-10 object-contain"
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"
                alt="Poké Ball logo"
            />
            <div class="text-2xl font-bold">POK&Eacute;DEX</div>
        </header>
        <div class="flex min-h-[calc(100vh-4rem)] flex-col sm:flex-row">
            <aside class="w-full border-b border-slate-200 bg-white p-4 h-[calc(100vh-4rem)] sm:w-64 sm:border-b-0 sm:border-r overflow-hidden">
                
                <ul id="poke-list" class="flex flex-col h-full gap-1 overflow-y-scroll">Loading</ul>
            </aside>
            <main  class="flex min-h-[calc(100vh-4rem)] flex-1 flex-col items-center p-6">
                <section id="hero" class="mt-8 flex w-full max-w-2xl flex-1 items-stretch justify-center gap-8" aria-label="Selected Pokemon"></section>
                </section>
                <div class="mt-auto flex w-full max-w-xl items-center justify-center gap-4 pt-6">
                    <button type="button" id="prev" class="hidden rounded bg-slate-700 px-4 py-2 font-semibold text-white hover:bg-slate-800">Previous</button>
                    <button type="button" id="next" class="rounded bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700">Next</button>
                </div>
            </main>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
